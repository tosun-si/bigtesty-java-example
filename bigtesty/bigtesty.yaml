# yaml-language-server: $schema=https://raw.githubusercontent.com/tosun-si/bigtesty/main/schemas/bigtesty-config.schema.json

# The datasets and tables created by `bigtesty infra create` for the JUnit tests, no BigTesty test files needed.
# The GCP project is given by the GOOGLE_CLOUD_PROJECT env var.
location: EU

datasets:
  - id: monitoring
    tables:
      - id: job_failure
        schema:
          - { name: featureName, type: STRING }
          - { name: jobName, type: STRING }
          - { name: dwhCreationDate, type: TIMESTAMP }

      - id: job_failure_summary
        schema:
          - { name: featureName, type: STRING, mode: REQUIRED }
          - { name: failuresCount, type: INT64, mode: REQUIRED }
